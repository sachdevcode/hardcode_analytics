services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://hardscope:hardscope@db:5432/hardscope
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE=http://localhost:3001
    command: sh -c "npm ci && npm run build && npx serve -s dist -l 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hardscope
      POSTGRES_PASSWORD: hardscope
      POSTGRES_DB: hardscope
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
